name: Native server packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-packages-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-14, platform: darwin, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: windows-2022, platform: win32, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      METIS_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate platform and tag
        shell: bash
        run: |
          node -e 'if(process.platform!==process.env.EXPECT_PLATFORM||process.arch!==process.env.EXPECT_ARCH||"v"+require("./package.json").version!==process.env.METIS_RELEASE_TAG)throw Error("Release identity mismatch")'
        env:
          EXPECT_PLATFORM: ${{ matrix.platform }}
          EXPECT_ARCH: ${{ matrix.arch }}
      - name: Install native dependencies without symlink requirements
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Verify updater transactions and native launchers
        run: pnpm exec tsx --test tests/package-update.test.mjs tests/installer-update.test.ts
      - name: Typecheck and build
        shell: bash
        run: |
          pnpm exec tsc --noEmit --pretty false
          METIS_RELEASE_COMMIT="$(git rev-parse HEAD)" METIS_RELEASE_VERSION="${METIS_RELEASE_TAG#v}" pnpm build
      - name: Retain production dependencies only
        run: pnpm prune --prod --config.node-linker=hoisted
      - name: Verify native runtime
        run: node -e "require('node:sqlite');require('node-pty');require.resolve('tsx')"
      - name: Build platform package
        run: node scripts/build-native-package.mjs
      - name: Smoke test the actual packaged app, worker, gateway and assets
        shell: bash
        run: node scripts/smoke-native-package.mjs "native-dist/metis-server-$METIS_RELEASE_TAG-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}-${{ matrix.arch }}
          path: native-dist/*
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: native-dist, merge-multiple: true }
      - name: Verify every platform before publication
        shell: bash
        run: |
          set -euo pipefail
          cd native-dist
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            test -s "metis-server-$TAG-$target.tar.gz"
            sha256sum --check "metis-server-$TAG-$target.tar.gz.sha256"
          done
      - name: Upload atomically gated release assets and publish
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Metis $TAG" --generate-notes
          gh release upload "$TAG" native-dist/* --clobber
          gh release edit "$TAG" --draft=false
