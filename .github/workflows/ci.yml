name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and native build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit --pretty false

      - name: Verify targeted SQL reads and question responses
        run: pnpm exec tsx --test tests/targeted-sql-reads.test.ts tests/question-flow.test.ts tests/question-reload.test.ts tests/user-input-continuation.test.ts tests/user-input-lease.test.ts tests/chat-checkpoints.test.ts tests/chat-memory-view.test.ts tests/context-layers.test.ts tests/shared-context.test.ts tests/reference-search-performance.test.ts

      - name: Verify assistant sessions and durable message queue
        run: pnpm exec tsx --test tests/assistant-origin.test.ts tests/desktop-assistant-session.test.ts tests/desktop-assistant.test.ts tests/codex-vision-input.test.ts tests/inspect-image.test.ts tests/assistant-screen-uploads.test.ts tests/queue-client.test.ts tests/queue-drain.test.ts tests/queue-removal.test.ts tests/queue-persistence-race.test.ts tests/queue-send-now.test.ts

      - name: Verify desktop annotations, file ownership and live capabilities
        run: pnpm exec tsx --test tests/desktop-visual-guidance.test.ts tests/desktop-overlay.test.ts tests/desktop-overlay-files.test.ts tests/desktop-overlay-gateway.test.ts tests/desktop-overlay-tool.test.ts tests/overlay-pdf-worker.test.ts tests/remote-presence-worker.test.ts

      - name: Verify usage charts and bounded runtime timing
        run: pnpm exec tsx --test tests/usage-chart.test.tsx tests/runtime-performance.test.ts tests/usage-model-contributions.test.ts tests/usage-api-costs.test.ts tests/account-profile-usage.test.ts

      - name: Verify CPU telemetry and monitor history
        run: pnpm exec tsx --test tests/server-cpu.test.ts tests/server-monitor.test.tsx

      - name: Verify notebook serialization and presence recovery
        run: pnpm exec tsx --test tests/note-collaboration.test.ts tests/note-collaboration-roundtrip.test.ts tests/notebook-presence.test.ts tests/notebook-presence-connection.test.ts tests/notes-editor-markdown.test.ts tests/notes-editor-performance.test.ts

      - name: Verify field dictation, voice and prompt contracts
        run: pnpm exec tsx --test tests/field-dictation.test.tsx tests/html-embed.test.tsx tests/sources-prompt.test.ts tests/voice-realtime.test.ts tests/composer-send.test.ts tests/question-contract.test.ts tests/credential-question-policy.test.mjs

      - name: Run release and updater contract tests
        run: pnpm exec tsx --test tests/release-manifest.test.ts tests/github-releases.test.ts

      - name: Test remote client startup and device routing
        run: pnpm exec tsx --test tests/remote-client-startup.test.mjs tests/device-routing.test.ts

      - name: Run local release contract test
        run: pnpm test:release

      - name: Check shell installers
        run: |
          set -euo pipefail
          for file in install/*.sh public/install/*.sh; do
            bash -n "$file"
          done

      - name: Build application
        run: pnpm build
