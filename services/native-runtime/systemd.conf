[Service]
# Install on BOTH app and worker only after all documented prerequisites pass.
Environment=METIS_NATIVE_ISOLATION=1
# Bubblewrap reads overflowuid/overflowgid before entering its private PID
# namespace. ProcSubset=pid hides these files even from the trusted launcher.
ProcSubset=all
ProtectProc=invisible
ProtectKernelTunables=yes
