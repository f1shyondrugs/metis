[Unit]
Wants=metis-browser-login.service
After=metis-browser-login.service

[Service]
# Set the same explicit opt-in on app, worker and isolated login services only
# after provisioning and testing the deployment described in the docs.
Environment=METIS_NATIVE_ISOLATION=1
# Keep the real HTTP engine as MainPID so the peer broker can reject native
# child processes, even when they share its Unix UID. Do not enable SIGUSR1
# debugging: a same-UID native process could otherwise attach an inspector.
ExecStart=
ExecStart=/srv/metis/toolchain/bin/node --disable-sigusr1 --import tsx /srv/metis/current/server.mjs
